@if (!favoritePhotos().length) {
  <p>
    No favorites photos
  </p>
} @else {
  <mat-grid-list
    cols="3"
    rowHeight="1:1"
    gutterSize="24px"
    class="favorites-list"
    >
    @for (photo of favoritePhotos(); track trackById($index, photo)) {
      <mat-grid-tile>
        <img
          [src]="getThumbnailUrl(photo.id)"
          [routerLink]="['/photos', photo.id]"
          alt="Favorite photo"
          />
      </mat-grid-tile>
    }
  </mat-grid-list>
}
